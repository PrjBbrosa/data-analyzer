      - heading "TimeDomain 右键菜单重设计方案" [level=1] [ref=e5]
      - paragraph [ref=e6]: 目标不是把 pyqtgraph 的原生菜单翻译完就交给用户，而是把“看图时真正会用”的动作放在前面，把高级/危险/少用的原生项收纳起来，并彻底避免说明气泡挡住二级菜单。
    - generic [ref=e7]:
      - text: 推荐方向：方案 A · 常用优先
      - paragraph [ref=e8]: 最适合 TraceLab 日常看曲线：一级菜单少、二级菜单清楚、说明固定在菜单底部，不再浮在最前面。高级 pyqtgraph 功能保留但降级到三级“高级显示”。
