[pytest]
markers =
    slow: opt-in performance and long-running checks excluded from the default suite
    crc_dense_discrete_policy: CRC pre-cap and always-on raster admission (parked unless DENSE_DISCRETE_POLICY_ENABLED)
    allow_blocking_modal: this test may run a real QDialog.exec_() without the offscreen fail-fast timeout
    static_source: AST/source ratchet that must not pay UI widget fixtures (qapp, ChartStack, pin scan)
addopts =
    -m "not slow"
