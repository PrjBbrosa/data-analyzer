<script>
let methodEngaged=false;

const methods={time:['时域','选择分析信号，查看它随时间或指定横轴的变化。'],fft:['频谱','选择分析信号，比较它们的频率成分。'],fft_time:['时频','选择分析信号，观察频率成分随时间的变化。'],order_time:['阶次','选择分析信号，并指定转速通道和 RPM 转换系数。'],frf:['频响','选择文件后，为每组目标指定输入信号和输出信号。']};
const channels=[['torque','Steering_Torque','N·m'],['angle','Steering_Angle','°'],['force','Rack_Force','N'],['current','Motor_Current','A'],['rpm','Motor_Speed','rpm']];const sourceNames=['Sweep_0.5_Forward_01.mf4','Sweep_0.5_Forward_02.mf4','TLC_Sweep_Forward_01.mf4','TLC_Sweep_Forward_02.mf4'];
const defaultConfig=()=>({pairs:[{input:'torque',output:''}],signals:[],rpm:'',factor:'1',preset:'稳健',estimator:'H1',window:'hanning',win:'2.0',overlap:'0.5',nfftMode:'auto',nfft:'1024',magnitude:'dB',frequency:'对数',phase:'展开',coherence:'0.8',fade:true,group:'source',maxOrder:'20',orderRes:'0.05',timeRes:'0.1',samples:'1024',weighting:'None',avg:'线性平均',avgOverlap:'0.5',amplitude:'RMS',xSource:'时间',xChannel:'angle',xOrigin:'各来源从 0 开始',layout:'叠加',slice:'',filter:false,filterType:'低通',filterHz:'10'});
let state={method:'frf',files:[0,1,2,3],gap:false,policy:'common',configs:Object.fromEntries(Object.keys(methods).map(k=>[k,defaultConfig()])),data:true,image:true,openFolder:true,directory:'~/Desktop/mf4_batch_output',axes:{x:{auto:true,min:'0',max:'100'},y:{auto:true,min:'-40',max:'20'},z:{auto:true,min:'0',max:'1'}},ticksX:'20',ticksY:'15',font:'100'};
const $=s=>document.querySelector(s),cfg=()=>state.configs[state.method],esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),channel=id=>channels.find(c=>c[0]===id)?.[1]||'尚未选择';let pickerDraft=[];
function available(source,id){return !(state.gap&&source===3&&id==='force')}
function targets(){return state.method==='frf'?cfg().pairs.map((p,i)=>({channels:[p.input,p.output],name:channel(p.input)+' → '+channel(p.output),complete:!!p.input&&!!p.output,index:i})):cfg().signals.map((id,i)=>({channels:[id,...(state.method==='order_time'?[cfg().rpm]:[]),...(state.method==='time'&&cfg().xSource==='指定信号'?[cfg().xChannel]:[])],name:channel(id),complete:state.method!=='order_time'||!!cfg().rpm,index:i}))}
function plan(){let ok=[],gaps=[];const ts=targets();for(const s of state.files)for(const t of ts){if(!t.complete)continue;const missing=t.channels.filter(id=>!available(s,id));(missing.length?gaps:ok).push({source:s,target:t.index,name:t.name,missing})}let images=cfg().group==='none'?ok.length:cfg().group==='source'?new Set(ok.map(x=>x.source)).size:new Set(ok.map(x=>x.target)).size;return {ok,gaps,complete:!!state.files.length&&!!ts.length&&ts.every(t=>t.complete),targets:ts.length,data:state.data?ok.length:0,images:state.image?images:0}}
function issue(){if(!state.files.length)return {text:'尚未添加数据文件',go:'去添加',target:'files',type:'files'};if(state.method==='frf'){for(let i=0;i<cfg().pairs.length;i++){const p=cfg().pairs[i];if(!p.input)return {text:`配对组 ${i+1} 尚未选择输入信号`,go:'去选择',target:'input-'+i};if(!p.output)return {text:`配对组 ${i+1} 尚未选择输出信号`,go:'去选择',target:'output-'+i}}}else{if(!cfg().signals.length)return {text:'尚未选择分析信号',go:'去选择',target:'signal-torque'};if(state.method==='order_time'&&!cfg().rpm)return {text:'尚未指定转速通道',go:'去选择',target:'rpm'}}const p=plan();if(p.gaps.length&&state.policy==='common')return {text:`${new Set(p.gaps.map(x=>x.source)).size} 个来源缺少目标信号`,go:'查看来源',target:'coverage-global',type:'gap'};if(!p.ok.length)return {text:'当前目标没有可用的来源',go:'去检查',target:'targetblock'};if(state.method!=='time'&&((state.method!=='order_time'&&!(Number(cfg().win)>0))||!(Number(cfg().overlap)>=0&&Number(cfg().overlap)<1)||!(Number(cfg().coherence)>=0&&Number(cfg().coherence)<=1)||(cfg().nfftMode==='manual'&&!(Number.isInteger(Number(cfg().nfft))&&Number(cfg().nfft)>=2))))return {text:'分析参数需要修正',go:'去检查',target:'param-fields'};if(state.method==='order_time'&&!(Number(cfg().factor)>0))return {text:'RPM 转换系数须大于 0',go:'去检查',target:'factor'};if(cfg().filter&&!(Number(cfg().filterHz)>0))return {text:'滤波截止频率须大于 0',go:'去检查',target:'filterHz'};if(!state.data&&!state.image)return {text:'尚未选择导出内容',go:'去选择',target:'export-data'};if(!state.directory.trim())return {text:'尚未填写输出目录',go:'去填写',target:'directory'};for(const [k,a] of Object.entries(state.axes)){if(!a.auto&&!(Number(a.max)>Number(a.min)))return {text:'坐标最大值须大于最小值',go:'去检查',target:'axis-'+k+'-max'}}return null}
function segment(key,options,value,scope='cfg'){return `<div class="seg">${options.map(([v,t])=>`<button data-seg="${key}" data-scope="${scope}" data-value="${v}" aria-pressed="${String(value)===String(v)}">${t}</button>`).join('')}</div>`}
function field(key,title,kind='number',options=[],extra=''){let control=kind==='select'?`<select id="${key}" data-cfg="${key}">${options.map(v=>`<option value="${esc(v)}" ${cfg()[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:kind==='seg'?segment(key,options,cfg()[key]):kind==='switch'?`<button class="switch" role="switch" aria-label="${title}" aria-checked="${cfg()[key]}" data-switch="${key}"></button>`:`<input id="${key}" type="${kind}" data-cfg="${key}" value="${esc(cfg()[key])}" ${extra}>`;return `<div class="field"><label ${kind==='number'||kind==='text'||kind==='select'?`for="${key}"`:''}>${title}</label>${control}</div>`}
function options(selected,rpmOnly=false){return `<option value="">${state.files.length?'请选择信号':'添加文件后选择'}</option>`+channels.filter(c=>rpmOnly?c[0]==='rpm':c[0]!=='rpm').map(c=>`<option value="${c[0]}" ${c[0]===selected?'selected':''}>${c[1]}</option>`).join('')}
function pair(p,i){const complete=p.input&&p.output,coverage=state.files.filter(s=>complete&&available(s,p.input)&&available(s,p.output)).length;return `<div class="pair"><div class="pairhead">${i===0?'FRF 配对　 ':''}配对组 ${i+1}<button class="quiet" data-remove-pair="${i}" ${cfg().pairs.length===1?'disabled':''}>删除</button></div><div class="pickrow"><label for="input-${i}">输入</label><select class="selectfield" id="input-${i}" data-pair="${i}" data-side="input" ${!state.files.length?'disabled':''}>${options(p.input)}</select></div><div class="pickrow"><label for="output-${i}">输出</label><select class="selectfield" id="output-${i}" data-pair="${i}" data-side="output" ${!state.files.length?'disabled':''}>${options(p.output)}</select></div><div class="coverage guidance ${!complete?'pending':coverage<state.files.length?'warning':''}">${!state.files.length?'添加文件后，显示候选信号。':!complete?(p.input?'下一步：为此输入指定输出信号。':'为此配对选择输入和输出信号。'):coverage===state.files.length?`✓ 此配对在全部 ${state.files.length} 个来源中可用`:`! ${state.files.length-coverage} 个来源缺少配对信号 <button class="link" data-action="coverage">查看来源</button>`}</div></div>`}
function inputHtml(){return `<div class="sectionhead"><h2>数据文件</h2><span class="note">${state.files.length} 个数据源 · ${state.files.length?(state.gap&&state.files.includes(3)?4:5):0} 个共同信号</span><span class="pill">${state.files.length?'全部就绪':'待添加'}</span></div><div class="files" id="files"><div class="filetools"><button data-action="add-files">＋ 已加载</button><button data-action="add-files">＋ 从磁盘…</button></div>${state.files.length?state.files.map(id=>`<div class="file"><span class="dot"></span><div class="name"><span title="${sourceNames[id]}">${sourceNames[id]}</span><small>/示例数据/批处理</small></div><span class="state">已就绪</span><button data-remove-file="${id}" aria-label="移除 ${sourceNames[id]}">×</button></div>`).join(''):'<div class="empty">还没有数据文件<br>从已加载文件选择，或从磁盘添加。</div>'}</div><div class="targetblock" id="targetblock"><div class="sectionhead"><h2>${state.method==='frf'?'输入与输出配对':state.method==='order_time'?'分析信号与转速':'分析信号'}</h2><span class="note">文件间匹配</span></div><div class="policyrow"><span>目标策略</span>${segment('policy',[['common','所有来源共有'],['available','按来源可用']],state.policy,'state')}</div>${state.method==='frf'?cfg().pairs.map(pair).join(''):`<div class="selectsignals">${channels.filter(c=>c[0]!=='rpm').map(c=>`<label class="signal" for="signal-${c[0]}"><input type="checkbox" id="signal-${c[0]}" data-signal="${c[0]}" ${cfg().signals.includes(c[0])?'checked':''} ${!state.files.length?'disabled':''}><span>${c[1]}</span><small>${c[2]}</small></label>`).join('')}</div>${state.method==='order_time'?`<div class="aux"><div class="field"><label for="rpm">RPM 通道</label><select id="rpm" data-cfg="rpm" ${!state.files.length?'disabled':''}>${options(cfg().rpm,true)}</select></div>${field('factor','RPM 系数','number',[],'min="0.0001" step="0.1"')}</div>`:''}<div class="coverage guidance ${!cfg().signals.length?'pending':''}">${!cfg().signals.length?'选择一个或多个信号后，会检查来源覆盖情况。':'✓ 已选 '+cfg().signals.length+' 个分析信号'}</div>`}${state.method==='frf'?'<div class="addpair"><button class="quiet" data-action="add-pair">＋ 添加配对组</button></div>':''}<div class="targetsum">${state.method==='frf'?cfg().pairs.length+' 个方向对':cfg().signals.length+' 个信号'} · ${state.files.length} 个逻辑来源 · ${state.policy==='common'?'全部来源共有':'按来源可用'}</div>${plan().gaps.length?`<div id="coverage-global" class="coverage warning guidance">${state.policy==='common'?'缺失信号需要处理后才能运行。':'将跳过 '+plan().gaps.length+' 项缺失组合。'} <button class="link" data-action="coverage">查看来源</button></div>`:''}</div><div class="eyebrow">可选 · 预处理</div><div class="preprocess"><b>预处理</b><small>${cfg().filter?'滤波已开启':'滤波关闭 · 保留原始数据'}</small><button class="switch" role="switch" aria-label="滤波" aria-checked="${cfg().filter}" data-switch="filter"></button></div>${cfg().filter?`<div class="aux">${field('filterType','类型','select',['低通','高通'])}${field('filterHz','截止频率 (Hz)','number',[],'min="0.001"')}</div>`:''}`}
function analysisHtml(){let params='';const nfft=field('nfftMode','NFFT 模式','seg',[['auto','自动'],['manual','手动']])+field('nfft','NFFT','number',[],`${cfg().nfftMode==='auto'?'disabled':''} min="2"`);const windowFields=field('window','窗函数','select',['hanning','hamming','blackman','boxcar'])+field('win','窗长 (s)','number',[],'min="0.001" step="0.1"')+field('overlap','重叠率','number',[],'min="0" max="0.95" step="0.05"');if(state.method==='frf')params=`<div class="paramcol"><h3>FRF 估计参数</h3>${field('estimator','估计器','seg',[['H1','H1'],['H2','H2']])}${windowFields}${nfft}</div><div class="paramcol"><h3>显示设置</h3>${field('magnitude','幅值','seg',[['dB','dB'],['线性','线性']])}${field('frequency','频率轴','seg',[['对数','对数'],['线性','线性']])}${field('phase','相位','seg',[['展开','展开'],['±180°','±180°']])}${field('coherence','相干阈值','number',[],'min="0" max="1" step="0.05"')}${field('fade','低相干淡化','switch')}</div>`;else if(state.method==='time')params=`<div class="paramcol">${field('xSource','X 轴来源','seg',[['时间','时间'],['指定信号','指定信号']])}${cfg().xSource==='时间'?field('xOrigin','时间起点','select',['各来源从 0 开始','保留原始时间']):`<div class="field"><label for="xChannel">X 通道</label><select id="xChannel" data-cfg="xChannel">${options(cfg().xChannel)}</select></div>`}</div><div class="paramcol">${field('layout','图片布局','seg',[['叠加','叠加'],['分图','分图']])}</div>`;else if(state.method==='order_time')params=`<div class="paramcol">${field('window','窗函数','select',['hanning','hamming','blackman'])}${nfft}${field('samples','每转样本','number',[],'min="2"')}</div><div class="paramcol">${field('maxOrder','最大阶次','number',[],'min="0.01"')}${field('orderRes','阶次分辨率','number',[],'min="0.001" step="0.01"')}${field('timeRes','时间分辨率 (s)','number',[],'min="0.001" step="0.1"')}${field('weighting','频率加权','select',['None','A','C'])}</div>`;else params=`<div class="paramcol">${windowFields}${nfft}</div><div class="paramcol">${state.method==='fft'?field('avg','平均模式','select',['单帧','线性平均','峰值保持'])+field('avgOverlap','平均重叠','number',[],'min="0" max="0.95" step="0.05"')+field('amplitude','幅值定义','select',['RMS','Peak','Peak-to-Peak']):''}${field('weighting','频率加权','select',['None','A','C'])}</div>`;return `${state.method==='time'?'':`<div class="sectionhead"><h2>分析预设</h2><span class="pill">与单次分析同步</span></div><div class="presets" id="presets">${['稳健','低频','快速','自定义'].map(x=>`<button data-preset="${x}" aria-pressed="${cfg().preset===x}">${x}</button>`).join('')}</div><div class="presetnote guidance" id="presetnote">${presetNote()}</div>`}<div class="paramtitle">${state.method==='frf'?'FRF 估计与显示':methods[state.method][0]+'参数'}<small id="preset-state">${state.method==='time'?'':'已应用：'+cfg().preset}</small></div><div class="paramsgrid" id="param-fields">${params}</div><div class="eyebrow">可选 · 图表组织</div><div class="field"><label for="group">图表组织</label><select id="group" data-cfg="group"><option value="none" ${cfg().group==='none'?'selected':''}>${state.method==='frf'?'每对一张':'每项单独'}</option><option value="source" ${cfg().group==='source'?'selected':''}>按来源叠加</option><option value="channel" ${cfg().group==='channel'?'selected':''}>按${state.method==='frf'?'输入/输出对':'信号'}叠加</option></select></div>${['fft_time','order_time'].includes(state.method)?`<div class="eyebrow">可选 · 切片</div>${field('slice','切片位置','text')}`:''}`}
function presetNote(){return cfg().preset==='自定义'?'已修改参数。当前设置会应用到全部有效目标。':state.method==='order_time'?`当前预设：${cfg().window} · 最大 ${cfg().maxOrder} 阶。可直接使用，也可在下方调整。`:`当前预设：${cfg().window} · 窗长 ${cfg().win} s。可直接使用，也可在下方调整。`}
function axisRows(){const x=state.method==='frf'||state.method==='fft'?'频率':state.method==='order_time'?'时间':'时间',y=state.method==='fft_time'?'频率':state.method==='order_time'?'阶次':'幅值';return `<div class="axisgrid"><span></span><span class="colhead">自动</span><span class="colhead">最小</span><span class="colhead">最大</span>${[['x',x],['y',y],...(['fft_time','order_time'].includes(state.method)?[['z','色阶']]:[])].map(([key,name])=>`<span>${name} (${key.toUpperCase()}):</span><input type="checkbox" aria-label="${name}自动范围" data-axis-auto="${key}" ${state.axes[key].auto?'checked':''}>${state.axes[key].auto?'<span class="autolabel">自动范围</span>':`<input aria-label="${name}最小值" type="number" id="axis-${key}-min" data-axis="${key}" data-bound="min" value="${esc(state.axes[key].min)}"><input aria-label="${name}最大值" type="number" id="axis-${key}-max" data-axis="${key}" data-bound="max" value="${esc(state.axes[key].max)}">`}<div class="axisrule"></div>`).join('')}</div>`}
function outputSummary(){const p=plan();if(!p.complete)return '<b>运行前确认</b><br>选择完整目标后，这里显示分析范围和输出组成。';return `<b>${p.ok.length} 项有效分析${p.gaps.length?' · '+p.gaps.length+' 项缺失':''}</b><br>预计 ${p.data+p.images} 个文件：${[state.data?p.data+' 份 XLSX':'',state.image?p.images+' 张 PNG':''].filter(Boolean).join(' + ')||'尚未选择导出内容'}<br>${cfg().group==='source'?'图片按来源叠加':cfg().group==='channel'?'图片按目标叠加':'每项单独出图'}${p.gaps.length?'<br>'+ (state.policy==='common'?'当前缺失项阻止运行':'缺失组合将被跳过'):''}<br><small>数量按本示例的输出规则计算。</small>`}
function outputHtml(){return `<div class="sectionhead"><h2>导出</h2><span class="note">仅保留可操作信息</span><button class="quiet" data-action="restore-output">恢复默认</button></div><div class="outputdir"><label for="directory">输出目录</label><input type="text" id="directory" data-state="directory" value="${esc(state.directory)}" title="${esc(state.directory)}"><button data-action="directory">选择…</button></div><label class="check"><input type="checkbox" data-state="openFolder" ${state.openFolder?'checked':''}>完成后打开输出文件夹</label><div class="exportrow"><span style="padding-top:9px">导出内容</span><div class="exportcard"><div class="exportchecks"><label class="check"><input type="checkbox" id="export-data" data-state="data" ${state.data?'checked':''}>数据文件</label><label class="check"><input type="checkbox" data-state="image" ${state.image?'checked':''}>图片</label></div><small>XLSX · PNG 1920×1080 · 冲突自动编号</small></div></div><fieldset class="fieldset"><legend>坐标范围</legend>${axisRows()}</fieldset><div class="stylebar"><small id="style-summary">刻度 X ${state.ticksX} · Y ${state.ticksY} · 字号 ${state.font}%</small><button data-action="style"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><path d="M2 2h5v7h7v5H2V2Z" stroke="currentColor" stroke-width="1.3"/><path d="M2 5h2m-2 3h2m3 3v3m3-3v3" stroke="currentColor" stroke-width="1.2"/></svg>刻度与字体</button></div><div class="outputsummary guidance" id="output-summary">${outputSummary()}</div>`}
function footerHtml(){const problem=issue(),p=plan();return `<div class="status"><span class="statusdot ${problem?'':'ready'}"></span><b>${problem?'待完善':'配置就绪'}</b><span class="reason">${problem?esc(problem.text):p.gaps.length?'将跳过 '+p.gaps.length+' 项缺失组合':'点击运行后生成任务'}</span>${problem?`<button class="link guidance" data-action="locate">${problem.go}</button>`:''}</div><button class="action" data-action="close">关闭</button><button class="action secondary" data-action="preview" ${problem?'disabled':''}>预览</button><button class="action primary" data-action="run" ${problem?'disabled':''}>运行</button>`}
function stagesHtml(){const p=plan();return `<div class="stage"><span class="number">02</span><b>文件与目标</b><small>${state.files.length} 文件 · ${state.method==='frf'?cfg().pairs.length+' 组配对':cfg().signals.length+' 信号'}</small></div><div class="stage"><span class="number">03</span><b>分析参数</b><small>${methods[state.method][0]}${state.method==='time'?'':' · '+cfg().window}</small></div><div class="stage"><span class="number">04</span><b>输出</b><small>${[state.data?'XLSX':'',state.image?'PNG':''].filter(Boolean).join(' + ')}${p.complete?' · '+(p.data+p.images)+' 个文件':''}</small></div>`}

function renderMethodGuide(){
 const shell=document.getElementById('shell');
 shell.classList.toggle('method-start',!methodEngaged);
 document.getElementById('method-label').textContent=methodEngaged?'分析方法':'先选分析方法';
 const method=methods[state.method][0];
 if(!methodEngaged){
  document.getElementById('methodtip').innerHTML='<span class="guide-copy">先确定分析方法，下方目标与参数会随之切换。</span>';
  return;
 }
 const problem=issue();
 const next=problem?(problem.type==='files'?'下一步：添加数据文件':problem.text):'配置已完整，可预览或运行';
 document.getElementById('methodtip').innerHTML=`<span class="guide-done">✓ 已选${method}</span><span class="guide-copy">${next}</span>`;
}

function refresh(){const positions=['input-pane','analysis-pane','output-pane'].map(id=>[id,document.getElementById(id).scrollTop]);const active=document.activeElement?.id;$('#methods').innerHTML=Object.entries(methods).map(([key,m])=>`<button class="method" data-method="${key}" aria-pressed="${state.method===key}">${m[0]}</button>`).join('');renderMethodGuide();$('#stages').innerHTML=stagesHtml();$('#input-pane').innerHTML=inputHtml();$('#analysis-pane').innerHTML=analysisHtml();$('#output-pane').innerHTML=outputHtml();$('#footer').innerHTML=footerHtml();positions.forEach(([id,y])=>document.getElementById(id).scrollTop=y);if(active&&active!=='scenario')document.getElementById(active)?.focus({preventScroll:true})}
function updateFeedback(){renderMethodGuide();const note=$('#presetnote');if(note)note.textContent=presetNote();const ps=$('#preset-state');if(ps&&state.method!=='time')ps.textContent='已应用：'+cfg().preset;document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.preset===cfg().preset)));$('#footer').innerHTML=footerHtml();$('#stages').innerHTML=stagesHtml();$('#output-summary').innerHTML=outputSummary()}
function locate(){const problem=issue();if(!problem)return;if(problem.type==='gap'){coverageModal();return}const el=document.getElementById(problem.target);if(!el)return;el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});(el.matches('input,select,button')?el:el.querySelector('input,select,button'))?.focus({preventScroll:true});el.classList.remove('highlight');void el.offsetWidth;el.classList.add('highlight')}
function modal(title,body,buttons='<button data-action="modal-close">返回配置</button>'){const d=$('#modal');d.innerHTML=`<h2>${title}</h2>${body}<div class="actions">${buttons}</div>`;d.showModal()}
function coverageModal(){const p=plan();modal('目标信号覆盖情况',`<p>${state.policy==='common'?'当前要求所有来源共有。以下组合缺少信号，需要处理后才能运行。':'已选择按来源可用，以下组合会跳过。'}</p>${p.gaps.map(g=>`<div class="listrow"><span>${sourceNames[g.source]}<br>${esc(g.name)}<br><span style="color:#a66b11">缺少 ${g.missing.map(channel).join('、')}</span></span></div>`).join('')}<p>可返回修改目标，或在左侧移除对应来源。</p>`,state.policy==='common'?'<button data-action="modal-close">返回修改</button><button class="primary" data-action="allow-skip">按来源可用，跳过缺失组合</button>':undefined)}
function loadScenario(name){methodEngaged=['ready','gap'].includes(name);state.method='frf';state.files=name==='empty'?[]:[0,1,2,3];state.gap=name==='gap';state.policy='common';state.configs=Object.fromEntries(Object.keys(methods).map(k=>[k,defaultConfig()]));cfg().pairs=[{input:name==='empty'?'':'torque',output:['ready','gap'].includes(name)?'force':''}];state.data=state.image=true;refresh();document.querySelectorAll('.pane').forEach(p=>p.scrollTop=0)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.method){methodEngaged=true;state.method=b.dataset.method;refresh();return}if(b.dataset.seg){const obj=b.dataset.scope==='state'?state:cfg();obj[b.dataset.seg]=b.dataset.value;if(!['policy','group','xSource','layout'].includes(b.dataset.seg))cfg().preset='自定义';refresh();return}if(b.dataset.switch){cfg()[b.dataset.switch]=!cfg()[b.dataset.switch];if(b.dataset.switch!=='filter')cfg().preset='自定义';refresh();return}if(b.dataset.preset){cfg().preset=b.dataset.preset;if(cfg().preset!=='自定义'){cfg().win=({'稳健':'2.0','低频':'8.0','快速':'0.5'})[cfg().preset];Object.assign(cfg(),{window:'hanning',overlap:'0.5',nfftMode:'auto'})}refresh();return}if(b.dataset.removeFile!==undefined){state.files=state.files.filter(id=>id!==+b.dataset.removeFile);refresh();return}if(b.dataset.removePair!==undefined){cfg().pairs.splice(+b.dataset.removePair,1);refresh();return}const a=b.dataset.action;if(a==='reset')loadScenario($('#scenario').value);if(a==='add-pair'){cfg().pairs.push({input:'',output:''});refresh();locate()}if(a==='locate')locate();if(a==='coverage')coverageModal();if(a==='allow-skip'){state.policy='available';$('#modal').close();refresh()}if(a==='modal-close')$('#modal').close();if(a==='add-files'){pickerDraft=[...state.files];modal('添加示例文件',`<p>此 HTML 使用示例文件，不访问磁盘。取消会保留原来的选择。</p>${sourceNames.map((n,i)=>`<label class="listrow"><input type="checkbox" data-pickfile="${i}" ${state.files.includes(i)?'checked':''}>${n}</label>`).join('')}`,'<button data-action="modal-close">取消</button><button class="primary" data-action="files-apply">添加所选文件</button>')}if(a==='files-apply'){state.files=[...pickerDraft];$('#modal').close();refresh()}if(a==='restore-output'){Object.assign(state,{data:true,image:true,openFolder:true,directory:'~/Desktop/mf4_batch_output',ticksX:'20',ticksY:'15',font:'100'});Object.values(state.axes).forEach(x=>x.auto=true);refresh()}if(a==='directory')modal('设置示例输出目录',`<p>原型只保存这里的文字，不读取目录或创建文件。</p><input type="text" id="directory-draft" aria-label="示例输出目录" value="${esc(state.directory)}">`,'<button data-action="modal-close">取消</button><button class="primary" data-action="directory-apply">确定</button>');if(a==='directory-apply'){state.directory=$('#directory-draft').value;$('#modal').close();refresh()}if(a==='style')modal('刻度与字体',`<div class="modalparams"><div class="field"><label for="draft-x">X 刻度</label><input id="draft-x" type="number" min="2" value="${state.ticksX}"></div><div class="field"><label for="draft-y">Y 刻度</label><input id="draft-y" type="number" min="2" value="${state.ticksY}"></div><div class="field"><label for="draft-font">字号 (%)</label><input id="draft-font" type="number" min="50" value="${state.font}"></div></div>`,'<button data-action="modal-close">取消</button><button class="primary" data-action="style-apply">确定</button>');if(a==='style-apply'){state.ticksX=$('#draft-x').value;state.ticksY=$('#draft-y').value;state.font=$('#draft-font').value;$('#modal').close();refresh()}if(a==='preview'){const p=plan();modal('结果预览 · 示意',`<p>${methods[state.method][0]} · ${p.ok.length} 项有效分析</p><div class="plot"><svg viewBox="0 0 500 150"><path d="M0 116C80 116 95 110 130 100S190 8 220 45S260 130 300 112S380 92 420 110S480 125 500 123" stroke="#1675df" fill="none" stroke-width="2"/></svg></div><p>曲线为示意，不是计算结果。正式预览继续使用现有程序入口。</p>${outputSummary()}`)}if(a==='run')modal('运行配置已完整',`<p>这是交互原型，没有执行分析或生成文件。</p>${outputSummary()}<p>输出目录：${esc(state.directory)}</p>`);if(a==='close')modal('布局预览',`<p>这是独立 HTML 讨论稿。当前配置保留，可返回继续体验，或关闭浏览器标签页。</p>`);if(a==='scheme-import'||a==='scheme-export')modal(a==='scheme-import'?'导入方案':'导出方案',`<p>保留当前面板的方案入口和位置。此原型不读写方案文件。</p>`)});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='scenario'){loadScenario(el.value);return}if(el.id==='guidance'){$('#shell').classList.toggle('hiding-guidance',!el.checked);return}if(el.dataset.pickfile!==undefined){pickerDraft=el.checked?[...pickerDraft,+el.dataset.pickfile]:pickerDraft.filter(x=>x!==+el.dataset.pickfile);return}if(el.dataset.pair!==undefined){cfg().pairs[+el.dataset.pair][el.dataset.side]=el.value;refresh()}else if(el.dataset.signal){cfg().signals=el.checked?[...cfg().signals,el.dataset.signal]:cfg().signals.filter(x=>x!==el.dataset.signal);refresh()}else if(el.dataset.cfg){cfg()[el.dataset.cfg]=el.value;if(!['group','rpm','xSource','xChannel','xOrigin','layout'].includes(el.dataset.cfg))cfg().preset='自定义';refresh()}else if(el.dataset.state){state[el.dataset.state]=el.type==='checkbox'?el.checked:el.value;refresh()}else if(el.dataset.axisAuto){state.axes[el.dataset.axisAuto].auto=el.checked;refresh()}else if(el.dataset.axis){state.axes[el.dataset.axis][el.dataset.bound]=el.value;updateFeedback()}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.cfg&&['number','text'].includes(el.type)){cfg()[el.dataset.cfg]=el.value;if(!['factor','slice','filterHz'].includes(el.dataset.cfg))cfg().preset='自定义';updateFeedback()}if(el.dataset.state==='directory'){state.directory=el.value;updateFeedback()}if(el.dataset.axis){state.axes[el.dataset.axis][el.dataset.bound]=el.value;updateFeedback()}});refresh();

document.getElementById('methods').addEventListener('keydown',e=>{
 if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 const buttons=[...document.querySelectorAll('#methods button')];const current=buttons.indexOf(document.activeElement);if(current<0)return;
 e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?buttons.length-1:(current+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;
 buttons[next].click();document.querySelectorAll('#methods button')[next].focus();
});
document.getElementById('scenario').value='empty';loadScenario('empty');
</script></body></html>
