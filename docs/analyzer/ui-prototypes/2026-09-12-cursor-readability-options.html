<header><div class="top"><div class="brand"><b>TraceLab</b>Cursor 面板设计讨论</div><h1>让数值排整齐，让信号名安静一点。</h1><p class="intro">同一组读数，三种信息布局。颜色只负责对应曲线，数字负责被读清楚。</p></div></header>
<main>
<div class="controls"><nav class="choices" aria-label="布局方案"><button data-mode="a" aria-pressed="false">A · 对齐表格</button><button data-mode="b" aria-pressed="true">B · 分组双行</button><button data-mode="c" aria-pressed="false">C · 差值优先</button><button data-mode="all" aria-pressed="false">对比全部</button></nav><div class="settings"><label>面板宽度 <select id="width"><option value="920">920 px</option><option value="740">740 px</option><option value="560">560 px</option></select></label><label><input id="short" type="checkbox">弱化公共前后缀</label></div></div>
<div id="demos"></div>
<aside class="recommendation"><strong>建议默认采用 B，收起时采用 C 的摘要思路。</strong> 长信号名独占一行，四项读数固定对齐；完整查看时无需点开通道。若经常同时比较很多通道，再考虑 A 的统一表格。</aside>

<script>
const channels=[
 {name:'Rte_CenterFeelTorque_mCentFeel_NominalSteerTorque_xds16',color:'#00aa9b',unit:'U_Nm',min:'0',max:'0',avg:'0',delta:'0'},
 {name:'Rte_InertiaModification_mInertiaCompMotorTorque_xds16',color:'#eb8500',unit:'U_Nm',min:'0.04102',max:'0.1592',avg:'0.1001',delta:'-0.3387'},
 {name:'Rte_RFCD2_kApplI_RackForceMerge_xds16',color:'#ff0752',unit:'',min:'-2923',max:'-2908',avg:'-2916',delta:'-1.231'},
 {name:'Rte_TAS_mTorsionBarTorque_xds16',color:'#00aa9b',unit:'U_Nm',min:'-1.779',max:'-1.723',avg:'-1.751',delta:'0.05743'}
];
const variants={a:{title:'A · 对齐表格',desc:'表头只出现一次，沿着同一列向下比较。',good:'适合多通道横向比较，Min / Max / Avg / ΔY 的位置始终固定。',cost:'长名称需要换行；面板较窄时保留表格宽度，用横向滚动查看。'},b:{title:'B · 分组双行',desc:'完整信号名在上，固定四列读数在下。推荐。',good:'最贴近现有阅读习惯；长名称有独立空间，四项统计量全部可见。',cost:'比表格占用更多高度，但每个通道的边界更明确。'},c:{title:'C · 差值优先',desc:'先读 ΔY，需要统计详情时再展开通道。',good:'减少遮挡，快速找差值；点击某个通道，可展开 Min / Max / Avg。',cost:'默认隐藏三项统计量；适合重点看差值，不适合同时比较所有统计量。'}};
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
const wrap=s=>esc(s).replaceAll('_','_<wbr>');
function name(c){return `<span class="name" title="${esc(c.name)}"><span class="full">${wrap(c.name)}</span><span class="short"><span class="affix">Rte_</span><wbr>${wrap(c.name.slice(4,-6))}<wbr><span class="affix">_xds16</span></span></span>`;}
function signal(c,unit=false){return `<div class="signal" style="--curve:${c.color}"><i class="dot" aria-hidden="true"></i><div class="signal-text">${name(c)}${unit?`<span class="unit">${c.unit||'单位未显示'}</span>`:''}</div></div>`;}
function metrics(c,delta=true){return `<div class="metrics">${[['Min','min'],['Max','max'],['Avg','avg'],...(delta?[['ΔY','delta']]:[])].map(([label,key])=>`<div class="metric ${key==='delta'?'delta':''}"><span class="tag">${label}</span><span class="num">${c[key]}</span></div>`).join('')}</div>`;}
function content(type){if(type==='a')return `<div class="tablewrap" tabindex="0" role="region" aria-label="通道统计表，可横向滚动"><table><thead><tr><th scope="col">信号 / 单位</th><th scope="col">Min</th><th scope="col">Max</th><th scope="col">Avg</th><th scope="col">ΔY</th></tr></thead><tbody>${channels.map(c=>`<tr><td>${signal(c,true)}</td><td class="num">${c.min}</td><td class="num">${c.max}</td><td class="num">${c.avg}</td><td class="num">${c.delta}</td></tr>`).join('')}</tbody></table></div>`;
 if(type==='b')return channels.map(c=>`<div class="group"><div class="signal" style="--curve:${c.color}"><i class="dot" aria-hidden="true"></i><div class="signal-text">${name(c)}</div><span class="unit">${c.unit||'单位未显示'}</span></div>${metrics(c)}</div>`).join('');
 return `<div class="focus-labels"><span>信号</span><span>ΔY / 单位</span></div>${channels.map(c=>`<details class="focus-row"><summary>${signal(c)}<div class="focus-value num">${c.delta}<span class="unit">${c.unit||'单位未显示'}</span></div><span class="chevron" aria-hidden="true">›</span></summary>${metrics(c,false)}</details>`).join('')}`;
}
function chart(){return `<svg class="trace" viewBox="0 0 1100 490" preserveAspectRatio="none" aria-hidden="true"><path d="M0 360 C90 340 145 377 230 355 S350 395 470 359 S650 355 740 388 S940 353 1100 369" fill="none" stroke="#00aa9b" stroke-width="2"/><path d="M0 405 C90 391 130 415 210 398 S340 415 445 399 S650 422 760 402 S955 430 1100 415" fill="none" stroke="#eb8500" stroke-width="2"/><path d="M0 439 C65 470 145 424 210 436 S340 471 445 454 S650 429 760 449 S955 471 1100 443" fill="none" stroke="#ff0752" stroke-width="2"/><path d="M430 0 V490" stroke="#327bff"/><path d="M530 0 V490" stroke="#ec6276"/><rect x="430" width="100" height="490" fill="#327bff" opacity=".04"/></svg>`;}
document.getElementById('demos').innerHTML=Object.entries(variants).map(([id,v])=>`<section class="demo" id="demo-${id}" ${id==='b'?'':'hidden'}><div class="story"><h2>${v.title}</h2><p>${v.desc}</p></div><div class="stage"><div class="chartbar"><b>TimeDomain / 双游标</b><span>四通道 · 浮动面板占位预览</span></div><div class="plot">${chart()}<div class="axis"><span>17.740 s</span><span>17.760 s</span><span>17.780 s</span><span>17.800 s</span><span>17.820 s</span></div><div class="panel"><div class="panelhead"><div class="range"><span><span class="tag">A</span><strong class="num">17.7710</strong><span class="unit">s</span></span><span><span class="tag">B</span><strong class="num">17.7906</strong><span class="unit">s</span></span><span class="interval"><span class="tag">ΔT</span><strong class="num">0.0196</strong><span class="unit">s</span></span><span class="secondary"><span class="tag">1/ΔT</span><strong class="num">51.09</strong><span class="unit">Hz</span></span></div><button class="collapse" aria-label="收起 ${id.toUpperCase()} 面板" aria-expanded="true">−</button></div><div class="panelbody">${content(id)}</div><div class="panelfoot">Min / Max / Avg：游标区间统计　　ΔY：沿用当前面板差值${id==='a'?'<span class="compact-hint">　·　表格可横向滚动</span>':''}${id==='c'?'　·　点击通道展开详情':''}</div></div></div></div><div class="note"><span><b>适合：</b>${v.good}</span><span><b>取舍：</b>${v.cost}</span></div></section>`).join('');
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{const mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b===button?'true':'false'));document.querySelectorAll('.demo').forEach(d=>d.hidden=mode!=='all'&&d.id!==`demo-${mode}`);}));
document.getElementById('width').addEventListener('change',e=>document.documentElement.style.setProperty('--panel-width',`${e.target.value}px`));
document.getElementById('short').addEventListener('change',e=>document.body.classList.toggle('short-names',e.target.checked));
document.querySelectorAll('.collapse').forEach(button=>button.addEventListener('click',()=>{const collapsed=button.closest('.panel').classList.toggle('collapsed');button.textContent=collapsed?'+':'−';button.setAttribute('aria-expanded',String(!collapsed));button.setAttribute('aria-label',`${collapsed?'展开':'收起'} ${button.closest('.demo').id.slice(-1).toUpperCase()} 面板`);}));
</script>
</body>
