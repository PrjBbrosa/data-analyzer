<body>
<div class="prototype"><div><h1>最终推荐 · 单页分析工作台</h1><p>交互讨论稿；所有文件、参数和曲线均为示例，不读取数据、不执行计算。</p></div><div class="scenario"><label for="scenario">体验场景</label><select id="scenario"><option value="target">已加文件，待选目标</option><option value="empty">首次打开</option><option value="ready">配置已就绪</option><option value="gap">部分来源缺少信号</option></select><button id="reset" class="subtle">重置</button></div></div>
<div class="shell"><header class="appbar"><span class="brand"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 14h4l3-10 5 17 3-11 2 4h3" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>TraceLab</span><span class="divider"></span><h2>批处理分析</h2><small>一次配置，应用到多个数据来源</small><span class="grow"></span><button class="subtle" data-action="scheme">方案 ▾</button></header>
<section class="recipebar"><div class="recipe-caption"><b>分析方法</b><small>决定目标与参数</small></div><div class="methods" role="group" aria-label="分析方法" id="methods"></div></section>
<div class="work"><main class="editor" id="editor"></main><aside class="aside" id="aside"></aside></div><footer class="footer" id="footer" aria-live="polite"></footer></div>
<div class="design-notes"><span><strong>关系清楚</strong>　方法统领目标与参数</span><span><strong>就地引导</strong>　提示下一项，允许自由修改</span><span><strong>完整反馈</strong>　运行前看见范围、缺失与输出</span></div><dialog class="modal" id="modal"></dialog>
<script>
const methods={time:{name:'时域',desc:'查看信号变化',path:'M1 17h5l3-12 5 20 4-14 3 6h8'},fft:{name:'频谱',desc:'比较频率成分',path:'M2 25h4V17h4v8h4V4h4v21h4V13h4v12h3'},fft_time:{name:'时频',desc:'追踪频率变化',path:'M3 7h7m4 0h9M3 15h4m4 0h16M6 23h9m4 0h8'},order_time:{name:'阶次',desc:'关联转速变化',path:'M3 26L12 4m-3 22L18 4m-3 22L24 4m-3 22L30 4'},frf:{name:'频响',desc:'关联输入与输出',path:'M1 21C7 21 9 20 12 11S19 2 21 12s5 10 10 9'}};
const catalog=[{id:'torque',name:'Steering_Torque',unit:'N·m'},{id:'angle',name:'Steering_Angle',unit:'°'},{id:'current',name:'Motor_Current',unit:'A'},{id:'force',name:'Rack_Force',unit:'N'},{id:'rpm',name:'Motor_Speed',unit:'rpm'}];
const sourceCatalog=[{id:'s1',name:'Sweep_Forward_01.mf4'},{id:'s2',name:'Sweep_Forward_02.mf4'},{id:'s3',name:'TLC_Sweep_Forward_01.mf4'},{id:'s4',name:'TLC_Sweep_Forward_02.mf4'}];
function defaults(k){return {pairs:[{input:'',output:''}],signals:[],rpm:'',factor:'1',x:'time',preset:'稳健',win:'2.0',overlap:'0.5',estimator:'H1',nfft:'auto',manualNfft:'1024',crop:false,start:'0',end:'10'}}
let state={method:'frf',files:['s1','s2','s3','s4'],gap:false,policy:'common',config:Object.fromEntries(Object.keys(methods).map(k=>[k,defaults(k)])),exportData:true,exportImage:true,directory:'~/Desktop/mf4_batch_output',imageSize:'1920 × 1080',notice:'',fileOpen:false};
const cfg=()=>state.config[state.method];const $=s=>document.querySelector(s);const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const label=id=>catalog.find(c=>c.id===id)?.name||'未选择';const unit=id=>catalog.find(c=>c.id===id)?.unit||'';
function available(source,channel){return !(state.gap&&source==='s4'&&channel==='force')}
function targets(){return state.method==='frf'?cfg().pairs.map((p,i)=>({label:label(p.input)+' → '+label(p.output),channels:[p.input,p.output],complete:!!p.input&&!!p.output,index:i})):cfg().signals.map((s,i)=>({label:label(s),channels:[s,...(state.method==='order_time'?[cfg().rpm]:[]),...(state.method==='time'&&cfg().x!=='time'?[cfg().x]:[])],complete:state.method!=='order_time'||!!cfg().rpm,index:i}))}
function plan(){const ts=targets();let valid=0,skipped=0;const gaps=[];for(const source of state.files)for(const t of ts){if(!t.complete)continue;const missing=t.channels.filter(ch=>!available(source,ch));if(missing.length){skipped++;gaps.push({source,channels:missing,target:t.label})}else valid++}return {valid,skipped,gaps,targetCount:ts.length,complete:!!ts.length&&ts.every(t=>t.complete),total:valid*(+state.exportData + +state.exportImage)}}
function problem(){if(!state.files.length)return {type:'files',title:'添加要批量分析的文件',desc:'先选方法或先加文件都可以；添加后会显示候选信号。',action:'添加文件'};if(state.method==='frf'){for(let i=0;i<cfg().pairs.length;i++){if(!cfg().pairs[i].input)return {type:'target',selector:`#input-${i}`,title:`选择${cfg().pairs.length>1?'配对 '+(i+1)+' 的':''}输入信号`,desc:'输入与输出的方向会影响频响结果。',action:'选择输入信号'};if(!cfg().pairs[i].output)return {type:'target',selector:`#output-${i}`,title:`选择${cfg().pairs.length>1?'配对 '+(i+1)+' 的':''}输出信号`,desc:'已选择输入，现在为它指定响应信号。',action:'选择输出信号'}}}else{if(!cfg().signals.length)return {type:'target',selector:'#signal-torque',title:'选择要分析的信号',desc:'可以选择多个信号，右侧会同步更新任务范围。',action:'选择分析信号'};if(state.method==='order_time'&&!cfg().rpm)return {type:'target',selector:'#rpm',title:'指定转速信号',desc:'阶次分析需要转速通道和正确的 RPM 转换系数。',action:'选择转速信号'}}const p=plan();if(p.gaps.length&&state.policy==='common')return {type:'gap',selector:'#coverage',title:'部分来源缺少所选信号',desc:'查看覆盖情况，或明确允许跳过缺失任务。',action:'处理信号缺失'};if(!p.valid)return {type:'target',selector:'#targets',title:'没有可以运行的任务',desc:'请检查目标与来源的对应关系。',action:'检查目标'};if(state.method!=='time'&&(!(Number(cfg().win)>0)||!(Number(cfg().overlap)>=0&&Number(cfg().overlap)<1)||(cfg().nfft==='manual'&&!(Number(cfg().manualNfft)>=2&&Number.isInteger(Number(cfg().manualNfft))))))return {type:'params',selector:'#compute-details',title:'检查计算参数',desc:'窗长须大于 0，重叠率须小于 1，手动 NFFT 须为至少 2 的整数。',action:'检查参数'};if(state.method==='order_time'&&!(Number(cfg().factor)>0))return {type:'target',selector:'#factor',title:'检查 RPM 转换系数',desc:'请填写大于 0 的转换系数。',action:'检查转换系数'};if(cfg().crop&&!(Number(cfg().end)>Number(cfg().start)&&Number(cfg().start)>=0))return {type:'params',selector:'#range-details',title:'检查分析区间',desc:'结束时刻须大于开始时刻，起点不得小于 0。',action:'检查区间'};if(!state.exportData&&!state.exportImage)return {type:'output',selector:'#exportData',title:'至少选择一种导出内容',desc:'可以导出数据、图片，或两者同时导出。',action:'选择输出内容'};if(!state.directory.trim())return {type:'output',selector:'#directory',title:'填写输出目录',de function render({preserve=true}={}){const open=preserve?[...document.querySelectorAll('details[open]')].map(x=>x.id):[];const scroll=$('#editor').scrollTop;const asideScroll=$('#aside').scrollTop;const focus=document.activeElement?.id;$('#methods').innerHTML=Object.entries(methods).map(([k,m])=>`<button class="method" data-method="${k}" aria-pressed="${k===state.method}"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="${m.path}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>${m.name}</b><small>${m.desc}</small></span></button>`).join('');$('#editor').innerHTML=editorHtml();$('#aside').innerHTML=asideHtml();$('#footer').innerHTML=footerHtml();for(const id of open){const el=document.getElementById(id);if(el)el.open=true}$('#editor').scrollTop=preserve?scroll:0;$('#aside').scrollTop=asideScroll;if(focus&&focus!=='scenario'&&focus!=='reset'){document.getElementById(focus)?.focus({preventScroll:true})}}

function scenario(value){state.method='frf';state.config=Object.fromEntries(Object.keys(methods).map(k=>[k,defaults(k)]));state.files=value==='empty'?[]:['s1','s2','s3','s4'];state.gap=value==='gap';state.policy='common';state.exportData=state.exportImage=true;state.directory='~/Desktop/mf4_batch_output';state.notice='';state.fileOpen=false;if(value==='ready'||value==='gap')cfg().pairs=[{input:'torque',output:'force'}];render({preserve:false})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.method&&b.dataset.method!==state.method){state.method=b.dataset.method;state.notice=`已切换到${methods[state.method].name}：文件保留，目标与参数使用该方法的配置。切回可恢复之前的选择。`;render({preserve:false});return}if(b.dataset.removeFile){state.files=state.files.filter(id=>id!==b.dataset.removeFile);render();return}if(b.dataset.removePair!==undefined){cfg().pairs.splice(+b.dataset.removePair,1);render();return}const a=b.dataset.action;if(a==='files-open')openFiles();if(a==='files-toggle'){state.fileOpen=!state.fileOpen;render()}if(a==='files-apply'){state.files=[...document.querySelectorAll('[name=pickfile]:checked')].map(el=>el.value);state.notice='文件已更新；各方法保存的目标已按当前示例来源重新校验。';$('#modal').close();render()}if(a==='modal-close')$('#modal').close();if(a==='dismiss'){state.notice='';render()}if(a==='pair-add'){cfg().pairs.push({input:'',output:''});render();jump('#input-'+(cfg().pairs.length-1))}if(a==='next'){const pr=problem();if(!pr)runDemo();else if(pr.type==='files')openFiles();else if(pr.type==='gap')coverage();else jump(pr.selector)}if(a==='preview')preview();if(a==='run-demo')runDemo();if(a==='coverage')coverage();if(a==='allow-skip'){state.policy='available';state.notice='已允许跳过缺失信号的组合。请留意右侧的实际任务范围。';$('#modal').close();render()}if(a==='scheme')modal('分析方案',`<p class="help">正式实现中，将“沿用当前单次分析”“导入方案”“导出方案”统一放在这里，减少主界面的并列按钮。</p><p class="plan-note">本演示不读取单次分析状态，也不导入或导出文件。</p>`);if(b.id==='reset')scenario($('#scenario').value)});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='scenario'){scenario(el.value);return}if(el.name==='pickfile')return;if(el.dataset.pair!==undefined){cfg().pairs[+el.dataset.pair][el.dataset.side]=el.value;state.notice='';render()}else if(el.dataset.signal){cfg().signals=el.checked?[...cfg().signals,el.dataset.signal]:cfg().signals.filter(s=>s!==el.dataset.signal);state.notice='';render()}else if(el.dataset.cfg){const k=el.dataset.cfg;cfg()[k]=el.type==='checkbox'?el.checked:el.value;if(['win','overlap','estimator','nfft','manualNfft'].includes(k))cfg().preset='自定义';if(k==='preset'&&el.value==='稳健'){Object.assign(cfg(),{win:'2.0',overlap:'0.5',estimator:'H1',nfft:'auto',manualNfft:'1024'})}render()}else if(el.dataset.state){state[el.dataset.state]=el.type==='checkbox'?el.checked:el.value;render()}else if(el.name==='policy'){state.policy=el.value;render()}});
document.addEventListener('input',e=>{const el=e.target;const k=el.dataset.cfg;if(k&&['win','overlap','manualNfft','factor','start','end'].includes(k)){cfg()[k]=el.value;if(['win','overlap','manualNfft'].includes(k)){cfg().preset='自定义';const preset=$('#preset');if(preset)preset.value='自定义';const expl=$('.preset-expl');if(expl)expl.textContent='参数已修改，下方摘要同步显示。';const detail=$('#compute-details .summary-facts');if(detail)detail.textContent='已自定义'}const strip=$('#compute .fact-strip');if(strip)strip.innerHTML=facts();const range=$('#range-details .summary-facts');if(range)range.textContent=cfg().crop?cfg().start+'–'+cfg().end+' s':'全时段';$('#aside').innerHTML=asideHtml();$('#footer').innerHTML=footerHtml()}else if(el.dataset.state==='directory'){state.directory=el.value;$('#footer').innerHTML=footerHtml()}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});render();
</script></body></html>
