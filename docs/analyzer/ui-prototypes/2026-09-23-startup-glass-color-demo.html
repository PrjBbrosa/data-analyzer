<body>
<header><div class="brandline"><img data-logo alt="TraceLab"><strong>TraceLab</strong><span>启动面板 / 配色与材质</span></div><span class="tag">保留 B 图案</span></header>
<main>
<div class="heading"><div><h1>更明亮，也更有色彩。</h1><p>同一张频谱、同一套布局。只比较蓝白配色、彩色线条与磨砂玻璃。</p></div><div class="view-switch" aria-label="预览方式"><button id="singleView" aria-pressed="true">单款细看</button><button id="compareView" aria-pressed="false">四款同屏</button></div></div>
<div class="toolbar-global"><span>四款使用相同的透明度与磨砂设置</span><button id="backToControls">返回调节材质</button><button id="compareMove">移动背景</button></div>
<div class="layout">
<aside class="palette-nav" aria-label="配色方案">
<button class="choice" data-palette="azure" aria-pressed="true"><span class="swatches"><i style="background:#c7edff"></i><i style="background:#17b6df"></i><i style="background:#1e85ed"></i><i style="background:#5773ed"></i></span><b>晴空蓝白</b><p>清亮的冰蓝玻璃，蓝与青轻轻跳跃。最贴近软件的蓝白色调。</p><small>推荐 · 稳妥而明快</small></button>
<button class="choice" data-palette="mint" aria-pressed="false"><span class="swatches"><i style="background:#d4faf5"></i><i style="background:#258ceb"></i><i style="background:#08b6c9"></i><i style="background:#23bc93"></i></span><b>青蓝薄荷</b><p>透亮的青蓝底色，加一点薄荷绿，轻盈、清爽。</p><small>更清新</small></button>
<button class="choice" data-palette="prism" aria-pressed="false"><span class="swatches"><i style="background:#e6e6ff"></i><i style="background:#1abde0"></i><i style="background:#4585ee"></i><i style="background:#9563e5"></i></span><b>蓝紫虹彩</b><p>蓝白玻璃上掠过淡紫与一点粉色，色彩更活泼。</p><small>更有彩色跳跃感</small></button>
<button class="choice" data-palette="coral" aria-pressed="false"><span class="swatches"><i style="background:#e5f1ff"></i><i style="background:#4e87ed"></i><i style="background:#e480a3"></i><i style="background:#f0a563"></i></span><b>蓝白珊瑚</b><p>保持蓝白基底，峰顶加入珊瑚与杏橙，增加暖色对比。</p><small>冷暖更鲜明</small></button>
<div class="material-settings"><h2>玻璃质感</h2><div><label class="slider-label" for="opacity">玻璃不透明度 <output id="opacityOut">75%</output></label><input id="opacity" type="range" min="50" max="95" value="75" step="1"></div><div><label class="slider-label" for="blur">磨砂模糊 <output id="blurOut">25 px</output></label><input id="blur" type="range" min="0" max="40" value="25" step="1"></div><label class="checkline"><input type="checkbox" id="frost" checked>开启背景磨砂</label><label class="checkline"><input type="checkbox" id="opaque">不透明回退对照</label><label class="checkline"><input type="checkbox" id="reduce">减少动态效果</label><button class="settings-reset" id="reset">恢复推荐参数</button></div>
</aside>
<section id="single" aria-label="单款配色预览">
<div class="preview-shell"><div class="preview-toolbar"><strong id="schemeTitle">晴空蓝白 / 磨砂玻璃</strong><div class="right"><label for="scene">预览背景</label><select id="scene"><option value="app">蓝白软件示意</option><option value="desktop">彩色桌面</option><option value="neutral">中性灰背景</option></select></div></div>
<div class="stage" id="mainStage"><div class="backdrop" aria-hidden="true"></div><div class="preview-fit" id="mainFit"></div></div>
<div class="toolbar-bottom"><div class="group"><button id="oldCompare" aria-pressed="false">对照当前灰蓝配色</button><button id="move">移动背景</button><button id="solo">只看面板</button><button id="leaveSolo">返回调色页</button></div><div class="group"><button id="pause" aria-pressed="false">暂停动画</button><button id="nextTip">下一条 tip</button></div></div></div>
<p class="caption" id="caption"><b>晴空蓝白：</b>白色玻璃保持通透，青蓝到靛蓝的频谱带来色彩，适合直接融入主界面。</p><div class="token-strip" id="tokens"></div><p class="unsupported" id="unsupported" hidden>当前浏览器未启用背景模糊，已使用高不透明度显示。</p>
</section>
<section id="compare" class="compare-grid" aria-label="四款配色同时对比" hidden></section>
</div>
<footer><span>配色与材质 HTML 原型 · 背景是蓝白界面示意，不是软件实时截图。</span><span>浏览器磨砂效果供选型；Windows 原生效果需另行接入与验证。</span></footer>
</main>
<template id="panelTemplate"><article class="splash azure" aria-label="启动面板"><div class="splash-head"><div class="brand"><img data-logo alt=""><div class="wordmark">TraceLab</div></div><span class="version">v8.3.2</span></div><div class="spectrum" aria-hidden="true"><svg viewBox="0 0 640 184"><defs><linearGradient class="spectrum-gradient"><stop offset="0" style="stop-color:var(--wave1)"/><stop offset=".4" style="stop-color:var(--wave2)"/><stop offset=".67" style="stop-color:var(--wave3)"/><stop offset="1" style="stop-color:var(--wave4)"/></linearGradient></defs><g class="spectral-lines"></g></svg><div class="spectrum-caption"><span>时域</span><span>频谱</span><span>时频</span><span>阶次</span><span>频响</span></div></div><div class="loading"><div class="status-row"><span class="spinner" aria-hidden="true"></span><span class="status">正在准备工作区…</span><span class="stage-label">工程数据分析工作台</span></div><div class="rail" aria-hidden="true"></div></div><div class="tip-box"><div class="tip-heading"><strong><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 11c0-2-2-2.2-2-5a4.5 4.5 0 0 1 9 0c0 2.8-2 3-2 5ZM6 13h4M6.5 15h3"/></svg><span class="tip-title">找回全局视野</span></strong><span class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i></span></div><p class="tip-copy">点击图表的 Home，可查看全部已绘通道范围。</p></div><div class="credit"><span>TraceLab · 工程信号与数据分析</span><span>GC02689</span></div></article></template>

// Unchanged B geometry: same formula, sampling, stroke widths, opacity, and mapping.
const spectrumRows=[];
for(let row=0;row<16;row++){
 const points=[];
 for(let sample=0;sample<=460;sample++){
  const i=sample/4,x=40+i*4.3+row*5.7;
  const peaks=56*Math.exp(-(((i-34-row*.4)/7)**2))+90*Math.exp(-(((i-67+row*.55)/8)**2))+23*Math.exp(-(((i-91)/6)**2));
  points.push([x,150-row*4-peaks*(.50+row*.035)+Math.sin(i*.35+row*.6)*2]);
 }
 spectrumRows.push(points);
}
const spectrumY=spectrumRows.flatMap(points=>points.map(p=>p[1]));
const spectrumMin=Math.min(...spectrumY),spectrumMax=Math.max(...spectrumY);
const paths=spectrumRows.map((points,row)=>({d:points.map(([x,y],i)=>(i?'L':'M')+x.toFixed(2)+' '+(15+(y-spectrumMin)/(spectrumMax-spectrumMin)*132).toFixed(2)).join(' '),width:row===15?1.65:1.05,opacity:.29+row*.044}));

for(const [key,p] of Object.entries(presets)){const item=document.createElement('div');item.className='compare-item';item.innerHTML='<div class="compare-label"><b>'+p.name+'</b><button data-open="'+key+'">单独查看</button></div><div class="stage"><div class="backdrop" aria-hidden="true"></div><div class="preview-fit"></div></div>';$('compare').appendChild(item);addPanel(item.querySelector('.preview-fit'),key,key);}

function fitPanels(){document.querySelectorAll('.preview-fit').forEach(host=>{const available=host.parentElement.clientWidth-parseFloat(getComputedStyle(host.parentElement).paddingLeft)-parseFloat(getComputedStyle(host.parentElement).paddingRight);if(available<=0)return;const scale=Math.min(1,available/640);host.style.width=(640*scale)+'px';host.style.height=(470*scale)+'px';host.style.setProperty('--scale',scale);});}

function setView(value){compare=value;document.body.classList.toggle('compare-mode',value);$('compare').hidden=!value;$('singleView').setAttribute('aria-pressed',String(!value));$('compareView').setAttribute('aria-pressed',String(value));requestAnimationFrame(fitPanels);}

function updateMaterials(){const alpha=Number($('opacity').value)/100,blur=Number($('blur').value);document.documentElement.style.setProperty('--surface-alpha',alpha);document.documentElement.style.setProperty('--blur',blur+'px');$('opacityOut').textContent=Math.round(alpha*100)+'%';$('blurOut').textContent=blur+' px';document.body.classList.toggle('no-blur',!$('frost').checked);document.body.classList.toggle('opaque',$('opaque').checked);document.body.classList.toggle('reduced',$('reduce').checked);}
