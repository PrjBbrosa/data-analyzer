nter;color:#526c8b;font-size:13px;padding:6px 0}.detailbody{padding:14px;background:var(--bg);border-radius:6px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.footer{padding:14px 22px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);background:#fff}.footer .status{flex:1;font-size:13px}.status b{display:block}.status small{font-size:12px}.output{display:flex;gap:20px;margin:12px 0}.navlayout{display:grid;grid-template-columns:185px minmax(0,1fr)}.rail{background:#f5f7fa;border-right:1px solid var(--line);padding:20px 14px}.rail .methodrow{display:block}.rail .method{display:block;width:100%;margin-bottom:9px;background:transparent;border-color:transparent}.rail .method.active{background:white;border-color:#a5c9f5;box-shadow:0 2px 5px #19385a06}.rail p{font-size:12px;color:var(--muted);margin:25px 8px}.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 24px;gap:28px}.tabs button{border:0;border-radius:0;padding:16px 2px;background:none}.tabs button.active{border-bottom:3px solid var(--blue)}.stepbar{display:flex;padding:20px 25px;border-bottom:1px solid var(--line);gap:25px}.stepbar button{border:0;background:none;padding:5px 0;display:flex;gap:9px;align-items:center}.stepbar em{font-style:normal;background:#e9eef5;border-radius:50%;width:25px;height:25px;display:grid;place-items:center}.stepbar .active em{background:var(--blue);color:white}.intro{margin-bottom:20px}.intro h2{font-size:21px;margin:0 0 5px}.intro p{margin:0;color:var(--muted)}.stage-methods{margin-bottom:25px}.stage-methods .method{padding:10px}.banner{padding:10px 15px;background:#edf5ff;color:#345f96;font-size:12px;border-left:3px solid var(--blue);margin-bottom:20px}.labfoot{max-width:1500px;margin:0 auto 30px;padding:0 30px;color:#61738b;font-size:13px}dialog{border:1px solid var(--line);border-radius:12px;padding:28px;max-width:560px;width:calc(100% - 40px);color:var(--ink)}dialog::backdrop{background:#20324b55}dialog h2{margin-top:0}.mockplot{height:160px;border-left:1px solid #aab8ca;border-bottom:1px solid #aab8ca;margin:25px 10px;background:repeating-linear-gradient(0deg,transparent,transparent 39px,#e8eef5 40px)}svg{width:100%;height:100%}.modalbuttons{display:flex;justify-content:flex-end;gap:8px}@media(min-width:1550px){.app{max-width:1440px;margin-left:auto;margin-right:auto}}@media(max-width:1050px){.workspace{grid-template-columns:1fr 235px}.twocol{grid-template-columns:1fr}.navlayout{grid-template-columns:155px 1fr}.method small{display:none}.main{padding:18px}.labtop{align-items:flex-start;flex-direction:column}}@media(max-width:720px){.app{margin:0 10px 20px}.lab{padding:18px 12px}.workspace{display:block}.aside{border-left:0;border-top:1px solid var(--line)}.navlayout{display:block}.rail{border:0}.rail .methodrow{display:flex}.rail .method{padding:6px}.rail p{display:none}.methodrow{flex-wrap:wrap}.method{min-width:85px}.stepbar{gap:8px;padding:14px}.footer{flex-wrap:wrap}.footer .status{flex-basis:100%}.titlebar{gap:8px}.titlebar .badge{display:none}}

<body><div class="lab"><div class="labtop"><div><h1>批处理分析，先建立正确的上下文</h1><div class="muted">布局讨论稿 · 示例数据 · 不读取本地文件、不执行分析</div></div><nav class="switch" aria-label="布局方案"><button data-layout="a">A 顶部方法导航</button><button data-layout="b">B 分析工作区</button><button data-layout="c">C 分阶段配置</button></nav></div><p class="pitch" id="pitch"></p></div><div class="app" id="app"></div><div class="labfoot" id="explain"></div><dialog id="modal"></dialog>
<script>
const methods={time:['时域','查看信号随时间的变化'],fft:['频谱','比较频率成分'],fft_time:['时频','观察频率随时间变化'],order_time:['阶次','分析与转速相关的成分'],frf:['频响','分析输入与输出的关系']};
const configs={a:['方法置顶，文件与目标并排','先建立分析上下文，文件和对应目标同屏配置；参数和输出退到次级层。适合保持当前面板的一屏效率。','推荐先比较 A：将“方法 → 目标”的依赖直接体现在上下布局中，文件仍可先添加。参数默认折叠，右侧只做任务确认。'],b:['每种分析有自己的工作区','左侧选择分析类别，右侧只出现该类别的目标与设置。文件与目标放在同一个“数据与目标”页签。','B 的重点是归属清楚：目标始终属于当前分析。优点是工作区宽；代价是参数和输出需要切换页签。'],c:['先配分析与数据，再确认参数和输出','第一阶段同时选择方法、文件和目标，完成后才进入参数与输出。方法决定目标，文件提供候选信号。','C 的引导最强：明确阶段、完整校验、可返回修改。代价是多一次页面切换；适合首次使用，频繁微调时可能较慢。']};
let layout='a',method='frf',files=4,tab=0,step=0,notice='',out={data:true,image:true},directory='~/Desktop/mf4_batch_output';
const cache={};Object.keys(methods).forEach(k=>cache[k]={target:'',response:'',rpm:'',preset:'稳健',window:'2.0',overlap:'0.5'});
const st=()=>cache[method];const names=['Sweep_0.5_Forward_01.mf4','Sweep_0.5_Forward_02.mf4','TLC_Sweep_Forward_01.mf4','TLC_Sweep_Forward_02.mf4'];
let activeNames=[...names];
function ready(){return files>0&&st().target&&(method!=='frf'||st().response)&&(method!=='order_time'||st().rpm)}
function missing(){return !files?'先添加要分析的文件':!st().target?(method==='frf'?'请选择输入信号':'请选择分析信号'):method==='frf'&&!st().response?'请选择输出信号':method==='order_time'&&!st().rpm?'请选择转速信号':!out.data&&!out.image?'请选择至少一种导出内容':'配置已就绪'}
function methodButtons(){return `<div class="methodrow">${Object.entries(methods).map(([k,v])=>`<button class="method ${method===k?'active':''}" data-method="${k}" aria-pressed="${method===k}"><strong>${v[0]}</strong><small>${v[1]}</small></button>`).join('')}</div>`}
function selectField(key,label,options){return `<div class="field"><label for="${key}">${label}</label><select id="${key}" data-key="${key}" ${!files?'disabled':''}><option value="">${files?'请选择信号':'添加文件后显示候选信号'}</option>${options.map(x=>`<option ${st()[key]===x?'selected':''}>${x}</option>`).join('')}</select></div>`}
function dataTargets(){return `<div class="twocol"><section><div class="sectionhead"><h2>数据文件</h2><span class="count">${files?files+' 个已就绪':'尚未添加'}</span></div><p class="help">方法与文件都可以先选。</p><div class="filebox">${files?activeNames.map((x,i)=>`<div class="file"><span class="dot">●</span><label>${x}<small>示例来源 ${i+1} · 5 个共同信号</small></label><button data-remove="${i}" aria-label="移除 ${x}">×</button></div>`).join(''):'<div class="empty"><b>添加你的分析数据</b><small>此原型使用 4 个示例文件。</small></div>'}</div><div class="tools"><button data-action="add">＋ 添加示例文件</button>${files?'<button class="link" data-action="clear">清空</button>':''}</div><details><summary>文件间信号匹配 · 全部来源共有</summary><div class="detailbody">本原型仅演示共同信号。正式设计需展示每个目标覆盖哪些来源，以及缺失时的跳过策略。</div></details></section><section><div class="sectionhead"><h2>${method==='frf'?'频响目标 · 输入与输出':method==='order_time'?'阶次目标 · 信号与转速':methods[method][0]+'目标 · 分析信号'}</h2></div><p class="help">${method==='frf'?'指定激励和响应，方向会影响频响结果。':method==='order_time'?'转速信号用于建立阶次与转速的对应关系。':'选择要批量分析的信号，候选来自当前文件。'}</p><div class="target">${selectField('target',method==='frf'?'输入 / 激励信号':'分析信号',['Steering_Torque','Steering_Angle','Motor_Current'])}${method==='frf'?'<div class="arrow">↓ 输入 → 输出</div>'+selectField('response','输出 / 响应信号',['Rack_Force','Steering_Angle','Motor_Current']):''}${method==='order_time'?selectField('rpm','转速信号',['Motor_Speed_RPM']):''}<div class="hint ${ready()?'':'warning'}">${ready()?'✓ 当前目标覆盖全部 '+files+' 个示例来源':missing()}</div></div><p class="help" style="margin-top:12px">${method==='frf'?'当前演示 1 组配对；多组配对在正式设计中按组展开。':'当前演示单信号；正式设计可扩展多选。'}</p></section></div>`}
function params(){return `<section><div class="sectionhead"><h2>${methods[method][0]}分析设置</h2></div><p class="help">先确认预设；需要调整时再展开具体参数。</p><div class="presetline"><select aria-label="分析预设" data-key="preset">${['稳健','低频','快速','自定义'].map(x=>`<option ${st().preset===x?'selected':''}>${x}</option>`).join('')}</select><small>${method==='time'?'全时段 · 原始信号 · 自动坐标':method==='frf'?'H1 · Hann 窗 · 窗长 '+st().window+' s · NFFT 自动':'Hann 窗 · 窗长 '+st().window+' s · NFFT 自动'}</small></div><details><summary>调整计算参数${st().preset==='自定义'?' · 已修改':''}</summary><div class="detailbody">${method==='time'?'时域示例使用全时段；分析区间与预处理应独立明确。':`<div class="fields"><div class="field"><label>窗长（s）</label><input type="number" min="0.01" step="0.1" data-key="window" value="${st().window}"></div><div class="field"><label>重叠率</label><input type="number" min="0" max="0.99" step="0.1" data-key="overlap" value="${st().overlap}"></div></div><small>预设仅演示选择状态，未模拟真实算法参数联动。</small>`}</div></details><details><summary>预处理与分析区间 · 未启用</summary><div class="detailbody">保留原始数据，全时段分析。正式实现中，裁剪、滤波必须在摘要里可见，并能单独关闭。</div></details><details><summary>图表显示 · 自动范围</summary><div class="detailbody">${method==='frf'?'幅值 dB · 频率对数轴 · 相位展开':'坐标范围自动'}。显示设置只影响图片呈现，不应暗中改变分析数据。</div></details></section>`}
function output(){return `<section><div class="sectionhead"><h2>保存结果</h2></div><p class="help">确认保存位置和需要的结果类型。</p><div class="field"><label for="directory">输出目录</label><input id="directory" type="text" value="${directory.replaceAll('&','&amp;').replaceAll('"','&quot;')}" data-directory></div><div class="output"><label><input type="checkbox" data-out="data" ${out.data?'checked':''}> 数据文件（XLSX）</label><label><input type="checkbox" data-out="image" ${out.image?'checked':''}> 图片（PNG）</label></div><details><summary>图片与文件设置</summary><div class="detailbody">示例：1920 × 1080 · 坐标自动范围 · 名称冲突自动编号。正式实现中可在这里调整刻度、字体与命名规则。</div></details></section>`}
function aside(){return `<aside class="aside"><h3>本次任务</h3><div class="summaryrow"><span>分析方法</span><strong>${methods[method][0]}</strong></div><div class="summaryrow"><span>数据范围</span><strong>${files?files+' 个示例来源':'待添加文件'}</strong></div><div class="summaryrow"><span>${method==='frf'?'输入 → 输出':'分析目标'}</span><strong>${st().target||'尚未选择'}${method==='frf'?'<br>↓<br>'+(st().response||'待选择输出'):''}${method==='order_time'?'<br>转速：'+(st().rpm||'待选择'):''}</strong></div><div class="summaryrow"><span>分析设置</span><strong>${st().preset}</strong></div><div class="summaryrow"><span>输出内容</span><strong>${[out.data?'XLSX':'',out.image?'PNG':''].filter(Boolean).join(' + ')||'尚未选择'}</strong></div><small>示例按来源分别输出。实际任务数与文件数需根据目标、图表组织方式和校验结果计算。</small></aside>`}
function render(){document.querySelectorAll('[data-layout]').forEach(b=>{b.classList.toggle('active',b.dataset.layout===layout);b.setAttribute('aria-pressed',b.dataset.layout===layout)});document.getElementById('pitch').textContent=configs[layout][1];document.getElementById('explain').textContent=configs[layout][2];let body='';let alert=notice?`<div class="banner" role="status">${notice}</div>`:'';
if(layout==='a')body=`<div class="topmethods"><strong>选择分析方法</strong> <small>目标选择会随方法变化</small>${methodButtons()}</div><div class="workspace"><main class="main">${alert}${dataTargets()}<div class="below">${params()}</div><details class="below"><summary>保存结果 · ${out.data?'XLSX ':''}${out.image?'+ PNG':''}</summary>${output()}</details></main>${aside()}</div>`;
if(layout==='b')body=`<div class="navlayout"><nav class="rail"><strong>分析类别</strong>${methodButtons()}<p>切换类别，右侧目标与参数一起切换。文件在类别之间共用。</p></nav><div><div class="tabs">${['数据与目标','分析设置','保存结果'].map((x,i)=>`<button data-tab="${i}" class="${tab===i?'active':''}">${x}</button>`).join('')}</div><div class="workspace"><main class="main"><div class="intro"><h2>${methods[method][0]}分析</h2><p>${methods[method][1]}</p></div>${alert}${tab===0?dataTargets():tab===1?params():output()}</main>${aside()}</div></div></div>`;
if(layout==='c')body=`<nav class="stepbar">${['分析与数据','分析设置','保存与运行'].map((x,i)=>`<button data-step="${i}" class="${step===i?'active':''}" ${i>0&&!ready()?'disabled':''}><em>${i+1}</em>${x}</button>`).join('')}</nav><div class="workspace"><main class="main">${alert}${step===0?`<div class="stage-methods"><strong>你要进行什么分析？</strong>${methodButtons()}</div>${dataTargets()}`:step===1?params():output()}</main>${aside()}</div>`;
document.getElementById('app').innerHTML=`<header class="titlebar"><span class="lights"><i></i><i></i><i></i></span><strong>批处理分析</strong><span class="badge">${configs[layout][0]}</span><span class="spacer"></span><button class="link" data-action="reset">重新体验空状态</button></header>${body}<footer class="footer"><div class="status"><b>${ready()&& (out.data||out.image)?'● ':''}${missing()}</b><small>${ready()?'确认任务摘要后可预览；原型不会生成文件。':'方法决定需要哪些目标，文件决定有哪些候选信号。'}</small></div>${layout==='c'&&step>0?'<button data-action="prev">上一步</button>':''}${layout==='c'&&step<2?`<button class="primary" data-action="next" ${!ready()?'disabled':''}>${step===0?'确认目标，设置参数':'确认参数，设置输出'}</button>`:`<button data-action="preview" ${!ready()||!out.data&&!out.image?'disabled':''}>预览结果</button><button class="primary" data-action="run" ${!ready()||!out.data&&!out.image?'disabled':''}>开始批量分析</button>`}</footer>`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.layout){layout=b.dataset.layout;notice='';render()}if(b.dataset.method&&b.dataset.method!==method){method=b.dataset.method;notice='已切换为'+methods[method][0]+'：文件保留，目标与参数切换到该类别；返回原类别可恢复之前的选择。';render()}if(b.dataset.tab!==undefined){tab=+b.dataset.tab;render()}if(b.dataset.step!==undefined){step=+b.dataset.step;render()}if(b.dataset.remove!==undefined){activeNames.splice(+b.dataset.remove,1);files=activeNames.length;if(!files)clearTargets();render()}const a=b.dataset.action;if(a==='add'){activeNames=[...names];files=4;notice='已添加 4 个示例文件，请选择当前分析需要的目标。';render()}if(a==='clear'){files=0;clearTargets();render()}if(a==='reset'){files=0;clearTargets();step=tab=0;notice='先选分析方法或先添加文件均可。';render()}if(a==='next'){step++;notice='';render()}if(a==='prev'){step--;render()}if(a==='preview'||a==='run'){const d=document.getElementById('modal');d.innerHTML=a==='preview'?`<h2>预览结构示意</h2><p>${methods[method][0]} · ${st().target}${method==='frf'?' → '+st().response:''}</p><div class="mockplot"><svg viewBox="0 0 480 160" preserveAspectRatio="none"><path d="M0 125 C40 125 50 120 75 119 S100 100 130 103 S180 18 210 30 S240 119 270 112 S320 82 350 99 S420 128 480 131" fill="none" stroke="#0669df" stroke-width="2.5"/></svg></div><p class="muted">曲线为布局示意，不是计算结果。正式预览应呈现代表输出与实际参数。</p><div class="modalbuttons"><button data-action="close">返回配置</button></div>`:'<h2>配置流程完成</h2><p>已体验从方法、文件、目标到参数与输出的操作路径。</p><p class="muted">这是交互原型，未运行计算，也未写入任何数据文件。</p><div class="modalbuttons"><button data-action="close">返回配置</button></div>';d.showModal()}if(a==='close')document.getElementById('modal').close()});
function clearTargets(){activeNames=[];Object.values(cache).forEach(s=>{s.target=s.response=s.rpm=''});step=0;notice='文件已清空，所有类别的目标选择已清除。分析参数保留。'}
document.addEventListener('change',e=>{if(e.target.dataset.key){const k=e.target.dataset.key;st()[k]=e.target.value;if(k==='window'||k==='overlap')st().preset='自定义';notice='';render()}if(e.target.dataset.out){out[e.target.dataset.out]=e.target.checked;render()}if(e.target.hasAttribute('data-directory'))directory=e.target.value});render();
