<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TraceLab · 轻量表达式检查</title><link rel="icon" href="data:,">
<style>
:root{--ink:#172132;--muted:#7a899b;--line:#dce4ef;--blue:#1769e0;--good:#248653;--bad:#ca414b}
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #9bbceb;outline-offset:2px}[hidden]{display:none!important}
main{max-width:584px;margin:40px auto;padding:0 22px}h1{font-size:19px;font-weight:600;margin:0 0 5px}.intro{font-size:13px;color:var(--muted);margin:0 0 24px}.panel{background:#fff;border:1px solid #d9e2ec;border-radius:9px;padding:20px;width:100%}.panel.narrow{max-width:336px;padding:16px}.heading{font-size:17px;margin:0 0 20px;display:flex;align-items:center;gap:15px}.heading:after{content:"";height:1px;background:var(--line);flex:1}.row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}.row label{white-space:nowrap}input,select{min-width:0;width:100%;height:40px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:0 10px}select{text-overflow:ellipsis}input::placeholder{color:#9098a5}.expression-row{position:relative;display:flex;min-width:0;align-items:center;gap:6px}.expression{flex:1;width:0;font:14px ui-monospace,SFMono-Regular,Consolas,monospace;transition:border-color .12s,background .12s}.expression.good{border-color:var(--good);background:#f5fcf7}.expression.bad{border-color:var(--bad);background:#fff7f7}.check{width:28px;height:28px;flex:0 0 28px;padding:0;display:grid;place-items:center;border:1px solid #cdd9e9;border-radius:5px;background:#f8faff;color:#516b8b;font-size:16px;line-height:1}.check.good{color:var(--good);border-color:#9ccbb0}.check.bad{color:var(--bad);border-color:#e3acb1}.help{width:18px;flex:0 0 18px;border:0;background:none;color:var(--blue);font-size:18px;font-weight:650;padding:0}.hint{font-size:12px;color:var(--muted);margin:2px 0 16px}.create{margin-left:60px;background:var(--blue);border:0;border-radius:7px;color:#fff;padding:7px 13px}.notice{font-size:12px;color:var(--muted);margin:12px 0 0}.notice:empty{display:none}.tip{position:absolute;right:0;top:calc(100% + 7px);width:278px;max-width:calc(100vw - 70px);z-index:10;padding:9px 12px;background:#fff;border:1px solid #d5dfe9;border-radius:6px;box-shadow:0 4px 14px #22354c18;font-size:12px;line-height:1.6}.tip strong{display:block;font-weight:600;margin-bottom:2px}.tip.good strong{color:var(--good)}.tip.bad strong{color:var(--bad)}.tip p{margin:0;color:#637186}.tip:before{content:"";position:absolute;right:31px;top:-5px;width:8px;height:8px;background:white;border-top:1px solid #d5dfe9;border-left:1px solid #d5dfe9;transform:rotate(45deg)}.demo-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:12px}.demo-controls select{width:148px;height:30px;font-size:12px}.demo-controls button{border:1px solid var(--line);border-radius:5px;padding:3px 9px;background:white;color:#65758a;font-size:12px}.foot{margin-top:12px;font-size:11px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.narrow .row{grid-template-columns:44px minmax(0,1fr);gap:8px}.narrow .create{margin-left:52px}.narrow .expression{font-size:12px}.narrow .tip{width:250px}
@media(max-width:600px){main{margin:26px auto;padding:0 16px}.panel{padding:17px}}@media(prefers-reduced-motion:reduce){.expression{transition:none}}
</style></head>
<body><main>
<h1>自定义表达式 · 轻量检查</h1><p class="intro">点 ✓ 检查；通过变绿，未通过变红，原因随点随看。</p>
<section class="panel" id="panel" aria-label="通道编辑器原型">
<h2 class="heading">双通道运算 (A ⊕ B)</h2>
<div class="row"><label for="channelA">通道A</label><select id="channelA"><option value="torqueA">mHwl_LimitedMotorTorque_gdf32</option><option value="torqueB">mHwl_ActualMotorTorque_gdf32</option></select></div>
<div class="row"><label for="operation">运算</label><select id="operation"><option value="custom">自定义表达式…</option><option value="add">A + B</option></select></div>
<div class="row"><label for="channelB">通道B</label><select id="channelB"><option value="torqueB">mHwl_ActualMotorTorque_gdf32</option><option value="torqueA">mHwl_LimitedMotorTorque_gdf32</option></select></div>
<div id="customArea">
<div class="row"><label for="expression">表达式</label><div class="expression-row" id="exprRow"><input class="expression" id="expression" spellcheck="false" aria-describedby="hint state" placeholder="例：sqrt(A^2 + B^2)"><button class="check" id="check" aria-label="检查表达式" title="检查表达式" aria-expanded="false" aria-controls="tip">✓</button><button class="help" id="help" aria-label="表达式帮助" title="表达式帮助" aria-expanded="false" aria-controls="tip">?</button><div id="tip" class="tip" role="status" hidden><strong id="tipTitle"></strong><p id="tipBody"></p></div></div></div>
<div class="hint" id="hint">A=通道A · B=通道B · t=时间 · ^ 为幂</div><span id="state" class="sr-only" role="status">尚未检查</span>
</div>
<div class="row"><label for="name">名称</label><input id="name" placeholder="留空自动生成"></div>
<button class="create" id="create">＋ 创建通道</button><p class="notice" id="notice" role="status"></p>
</section>
<div class="demo-controls"><label for="scenario">演示场景</label><select id="scenario"></select><button id="width" aria-pressed="false">336 px 窄面板</button></div>
<p class="foot">仅 UI 原型，使用合成数据案例，未接入应用。修改输入会清除旧检查状态。</p>
</main>
<script id="fixtures" type="application/json">{"pass": {"expr": "sqrt(A^2 + B^2) * 0.5", "kind": "good", "title": "检查通过", "message": "当前文件全量试算完成，1,001 / 1,001 点有效。", "details": [["检查范围", "全量 · 0.00–10.00 s"], ["结果点数", "1,001 点"], ["有效点", "1,001 点"], ["无效点", "0 点（0.00%）"], ["最小值", "14.9697"], ["最大值", "23.6179"]]}, "syntax": {"expr": "sqrt(A^2 + B^2", "kind": "bad", "title": "表达式未通过检查", "message": "表达式语法错误：'(' was never closed", "advice": "右括号未闭合，请在末尾补上 )。"}, "unknown": {"expr": "A + C", "kind": "bad", "title": "表达式未通过检查", "message": "未知变量 “C”（可用变量：A, B, t, time）", "advice": "C 尚未定义。可用变量为 A、B、t（time 为时间别名）。"}, "partial": {"expr": "A / B", "kind": "warn", "title": "可计算，但有无效结果", "message": "10 / 1,001 点无效（1.00%），绘图时将显示为断点。", "details": [["检查范围", "全量 · 0.00–10.00 s"], ["结果点数", "1,001 点"], ["有效点", "991 点"], ["无效点", "10 点（1.00%）"], ["最小值", "0.789007"], ["最大值", "1.87766"], ["首个无效点", "第 301 点 · t = 3.00 s"]], "advice": "本案例中，B 在 3.00–3.09 s 为零。请检查分母或明确无效点的处理方式。"}, "invalid": {"expr": "sqrt(-abs(A))", "kind": "bad", "title": "无法创建：结果全部无效", "message": "1,001 个结果全部为 NaN/Inf，不能生成有效通道。", "details": [["检查范围", "全量 · 0.00–10.00 s"], ["结果点数", "1,001 点"], ["有效点", "0 点"], ["无效点", "1,001 点（100.00%）"], ["首个无效点", "第 1 点 · t = 0.00 s"]], "advice": "sqrt 的输入为负数。请确认公式定义域，不自动替换为绝对值。"}, "scalar": {"expr": "mean(A)", "kind": "good", "title": "检查通过", "message": "当前文件全量试算完成，1,001 / 1,001 点有效。", "details": [["检查范围", "全量 · 0.00–10.00 s"], ["结果点数", "1,001 点"], ["有效点", "1,001 点"], ["无效点", "0 点（0.00%）"], ["最小值", "31.8345"], ["最大值", "31.8345"]], "advice": "mean(A) 返回整条信号的均值，创建时广播为 1,001 点常量通道。这是有效表达式。"}, "same": {"expr": "A - B", "kind": "good", "title": "检查通过", "message": "当前文件全量试算完成，1,001 / 1,001 点有效。", "details": [["检查范围", "全量 · 0.00–10.00 s"], ["结果点数", "1,001 点"], ["有效点", "1,001 点"], ["无效点", "0 点（0.00%）"], ["最小值", "0"], ["最大值", "0"]], "advice": "提示：A 与 B 绑定同一通道，A - B 的结果为 0。允许创建，请确认这符合你的意图。"}, "length": {"expr": "A + B", "kind": "bad", "title": "无法检查：通道 B 长度不匹配", "message": "时间轴有 1,001 点，通道 B 只有 800 点。", "advice": "请选择与当前文件时间轴一致的通道；不自动截断或补齐。", "dataError": true}}</script>
<script>
const $=id=>document.getElementById(id),fixtures=JSON.parse($('fixtures').textContent);
const cases=[['pass','正常公式'],['syntax','括号缺失'],['unknown','未知变量'],['partial','部分无效'],['invalid','全部无效'],['scalar','统计常量'],['same','A / B 同源'],['length','长度不匹配']];
let checked=null,revision=0,timer=null,tipOwner=null,count=0;
function hideTip(){$('tip').hidden=true;tipOwner=null;$('check').setAttribute('aria-expanded','false');$('help').setAttribute('aria-expanded','false')}
function showTip(title,body,kind='',owner='check'){$('tipTitle').textContent=title;$('tipBody').textContent=body;$('tip').className='tip '+kind;$('tip').hidden=false;tipOwner=owner;$('check').setAttribute('aria-expanded',String(owner==='check'));$('help').setAttribute('aria-expanded',String(owner==='help'))}
function reset(){revision++;clearTimeout(timer);checked=null;hideTip();$('expression').className='expression';$('expression').removeAttribute('aria-invalid');$('check').className='check';$('check').textContent='✓';$('check').disabled=false;$('check').title='检查表达式';$('check').setAttribute('aria-label','检查表达式');$('create').disabled=false;$('state').textContent='尚未检查';$('notice').textContent=''}
function selectCase(key){reset();$('operation').value='custom';$('customArea').hidden=false;$('expression').value=fixtures[key].expr;$('channelA').value='torqueA';$('channelB').querySelector('[value="short"]')?.remove();if(key==='length'){const option=new Option('short_channel（800 点）','short');$('channelB').append(option)}$('channelB').value=key==='same'?'torqueA':key==='length'?'short':'torqueB'}
for(const [key,label] of cases)$('scenario').append(new Option(label,key));
function getFixture(){if(!$('expression').value.trim())return {kind:'bad',title:'请输入表达式',body:'例如 sqrt(A^2 + B^2)。'};const key=cases.map(c=>c[0]).find(k=>fixtures[k].expr===$('expression').value.trim()&&$('channelA').value==='torqueA'&&$('channelB').value===(k==='same'?'torqueA':k==='length'?'short':'torqueB'));if(!key)return null;const f=fixtures[key];const brief={pass:'当前文件全量试算，1,001 / 1,001 点有效。',syntax:'缺少右括号，请在表达式末尾补上 )。',unknown:'未知变量 C。可用变量：A、B、t / time。',partial:'10 / 1,001 点无效，首个在 3.00 s。仍可创建，曲线在无效点处断开。',invalid:'全部 1,001 点无效。请检查 sqrt 的输入是否为负数。',scalar:'检查通过；mean(A) 将生成常量通道。',same:'检查通过；A、B 为同一通道，A - B 的结果为 0。',length:'B 有 800 点，时间轴有 1,001 点。请选择长度一致的源。'};return {...f,kind:f.kind==='good'?'good':'bad',canCreate:f.kind==='good'||f.kind==='warn',title:f.kind==='good'?'检查通过':key==='partial'?'检查发现无效点':'检查未通过',body:brief[key]}}
function render(f){const ok=f.kind==='good';$('expression').className='expression '+f.kind;$('expression').setAttribute('aria-invalid',String(!ok));$('check').className='check '+f.kind;$('check').textContent=ok?'✓':'!';$('check').title=f.title+'：'+f.body;$('check').setAttribute('aria-label','检查表达式：'+f.title);$('state').textContent=f.title+'。'+f.body;$('create').disabled=!f.canCreate;showTip(f.title,f.body,f.kind)}
function createDemo(){count++;$('notice').textContent='演示：已创建 '+count+' 条通道，实际数据未修改。'}
function runCheck(createAfter=false){const f=getFixture(),token=++revision;checked=null;hideTip();$('expression').className='expression';$('check').className='check';$('check').textContent='…';$('check').disabled=true;$('create').disabled=true;$('state').textContent='检查中';timer=setTimeout(()=>{if(token!==revision)return;$('check').disabled=false;if(!f){$('check').textContent='✓';$('state').textContent='此输入尚未检查';showTip('尚未检查','原型仅支持下方演示案例；自由输入尚未接入求值器。');return}checked=f;render(f);if(createAfter&&f.canCreate)createDemo()},350)}
$('check').addEventListener('click',()=>{if(checked){if(tipOwner==='check')hideTip();else showTip(checked.title,checked.body,checked.kind)}else runCheck()});
$('create').addEventListener('click',()=>{if($('operation').value!=='custom'){$('notice').textContent='本原型仅演示自定义表达式。';return}if(!checked)runCheck(true);else if(checked.canCreate)createDemo()});
for(const id of ['expression','channelA','channelB'])$(id).addEventListener(id==='expression'?'input':'change',reset);
$('scenario').addEventListener('change',()=>selectCase($('scenario').value));
$('operation').addEventListener('change',()=>{reset();$('customArea').hidden=$('operation').value!=='custom'});
$('help').addEventListener('click',()=>{if(tipOwner==='help')hideTip();else showTip('表达式帮助','A / B 是源通道，t 是时间。支持 sqrt、abs、mean 等函数，^ 表示幂。','','help')});
document.addEventListener('pointerdown',e=>{if(!$('exprRow').contains(e.target))hideTip()});
document.addEventListener('focusin',e=>{if(!$('exprRow').contains(e.target))hideTip()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});
$('width').addEventListener('click',()=>{const narrow=$('panel').classList.toggle('narrow');$('width').setAttribute('aria-pressed',String(narrow));hideTip()});
selectCase('pass');
</script></body></html>
